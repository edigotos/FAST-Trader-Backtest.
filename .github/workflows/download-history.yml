name: Historical data collection
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Janela em meses calendarios"
        required: false
        default: "12"
      symbols:
        description: "Lista de simbolos separada por virgula"
        required: false
        default: "BTCUSDT,ETHUSDT,ALICEUSDT,XRPUSDT,SOLUSDT"
  push:
    paths:
      - '.github/workflows/download-history.yml'
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download 2h Binance Futures candles
        run: |
          SYMBOLS="${{ inputs.symbols || 'BTCUSDT,ETHUSDT,ALICEUSDT,XRPUSDT,SOLUSDT' }}"
          MONTHS="${{ inputs.months || '12' }}"
          python scripts/download_binance.py --symbols "$SYMBOLS" \
            --interval 2h --market futures --months "$MONTHS" --jobs 6
          python scripts/backfill_gaps.py --dataset-dir data --market futures --interval 2h
      - uses: actions/upload-artifact@v4
        with:
          name: binance-futures-2h-historical
          path: |
            data/raw/
            data/futures/2h/
          retention-days: 7
