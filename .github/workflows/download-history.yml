name: Historical data collection
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/download-history.yml'
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download 2h Binance Futures candles
        run: |
          for symbol in BTCUSDT ETHUSDT SOLUSDT XRPUSDT BNBUSDT; do
            python scripts/download_binance.py --symbol "$symbol" --interval 2h --months 12 --market futures
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binance-futures-2h-historical
          path: data/raw/
          retention-days: 7
